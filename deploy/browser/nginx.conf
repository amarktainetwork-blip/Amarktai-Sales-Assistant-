worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 512;
}

http {
  access_log off;
  client_body_temp_path /tmp/nginx-client-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  server {
    listen 9222;

    location / {
      rewrite ^/json/version/$ /json/version break;
      proxy_pass http://127.0.0.1:9223;
      proxy_http_version 1.1;
      proxy_set_header Host 127.0.0.1:9223;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      # CDP is a long-lived WebSocket. Nginx defaults proxy_read_timeout to 60s,
      # which tears down otherwise healthy, idle Playwright/CDP sessions and
      # disposes retained incognito contexts such as an in-progress Genie MFA
      # challenge. Keep the tunnel alive well beyond the 15-minute MFA window.
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
      sub_filter_types application/json;
      sub_filter_once off;
      sub_filter "ws://127.0.0.1:9223/" "ws://$http_host/";
    }
  }
}
