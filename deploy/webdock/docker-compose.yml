services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  app:
    build:
      context: ../..
      dockerfile: deploy/webdock/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://amarktai:${DB_PASSWORD}@db:3306/amarktai_sales_assistant
      REDIS_URL: redis://redis:6379
      BROWSERLESS_WS_ENDPOINT: ws://browser:3000?token=${BROWSERLESS_TOKEN}
      GENIE_SCRIPTS_CONFIG_PATH: /app/config/genie-scripts.json
      GENIE_ARTIFACT_DIR: /app/data/genie-artifacts
    volumes:
      - ./config:/app/config:ro
      - ./files/screenshots:/app/data/genie-artifacts
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      browser:
        condition: service_started

  worker:
    build:
      context: ../..
      dockerfile: deploy/webdock/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      DATABASE_URL: mysql://amarktai:${DB_PASSWORD}@db:3306/amarktai_sales_assistant
      REDIS_URL: redis://redis:6379
      BROWSERLESS_WS_ENDPOINT: ws://browser:3000?token=${BROWSERLESS_TOKEN}
      GENIE_SCRIPTS_CONFIG_PATH: /app/config/genie-scripts.json
      GENIE_ARTIFACT_DIR: /app/data/genie-artifacts
    command:
      [
        "sh",
        "-c",
        "echo '0 */12 * * * /app/scripts/run-genie-health-check.sh >> /proc/1/fd/1 2>&1' | crontab - && cron -f",
      ]
    volumes:
      - ./config:/app/config:ro
      - ./files/screenshots:/app/data/genie-artifacts
    depends_on:
      db:
        condition: service_healthy
      browser:
        condition: service_started

  db:
    image: mariadb:11.7
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: amarktai_sales_assistant
      MARIADB_USER: amarktai
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  browser:
    image: ghcr.io/browserless/chromium:latest
    restart: unless-stopped
    environment:
      TOKEN: ${BROWSERLESS_TOKEN}
      CONCURRENT: 1
      QUEUED: 5
      TIMEOUT: 120000
      PREBOOT_CHROME: "true"
    shm_size: 1gb

volumes:
  caddy_data:
  caddy_config:
  db_data:
  redis_data:
