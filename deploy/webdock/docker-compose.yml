services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  app:
    build:
      context: ../..
      dockerfile: deploy/webdock/Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - ../../.env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://amarktai:${DB_PASSWORD}@db:3306/amarktai_sales_assistant
      REDIS_URL: redis://redis:6379
      BROWSERLESS_WS_ENDPOINT: http://browser:9222
      GENIE_SCRIPTS_CONFIG_PATH: /app/config/genie-scripts.json
      GENIE_ARTIFACT_DIR: /app/data/connector-evidence
      GENIE_PERSISTENT_PROFILE_BINDING_PATH: /app/data/connector-evidence/.genie-persistent-profile-owner.json
      STT_PROVIDER_LABEL: Self-hosted whisper.cpp b4938
      STT_TRANSCRIPTIONS_URL: http://stt:8080/inference
      STT_HEALTH_URL: http://stt:8080/
      STT_MODEL: ggml-base-q5_1
      TTS_PROVIDER_LABEL: Self-hosted Piper 1.7.0
      TTS_BASE_URL: http://tts:5000
      TTS_DEFAULT_VOICE: en_US-lessac-medium
    volumes:
      - ./config:/app/config:ro
      - ./files/connector-evidence:/app/data/connector-evidence
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      browser:
        condition: service_healthy
      stt:
        condition: service_healthy
      tts:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  worker:
    build:
      context: ../..
      dockerfile: deploy/webdock/Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - ../../.env
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://amarktai:${DB_PASSWORD}@db:3306/amarktai_sales_assistant
      REDIS_URL: redis://redis:6379
      BROWSERLESS_WS_ENDPOINT: http://browser:9222
      GENIE_SCRIPTS_CONFIG_PATH: /app/config/genie-scripts.json
      GENIE_ARTIFACT_DIR: /app/data/connector-evidence
      GENIE_PERSISTENT_PROFILE_BINDING_PATH: /app/data/connector-evidence/.genie-persistent-profile-owner.json
      CRM_HEALTH_INTERVAL_MS: 43200000
    command: ["node", "dist/genie/healthWorker.js"]
    volumes:
      - ./config:/app/config:ro
      - ./files/connector-evidence:/app/data/connector-evidence
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      browser:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  reporter:
    build:
      context: ../..
      dockerfile: deploy/webdock/Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - ../../.env
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://amarktai:${DB_PASSWORD}@db:3306/amarktai_sales_assistant
      REPORT_SCHEDULER_POLL_MS: 30000
    command: ["node", "dist/reportSchedulerWorker.js"]
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  db:
    image: mariadb:11.7.2
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: amarktai_sales_assistant
      MARIADB_USER: amarktai
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true

  # Valkey is an open-source Redis-protocol-compatible data store. Keep the service
  # name/REDIS_URL stable so application code and future BullMQ workers need no change.
  redis:
    image: valkey/valkey:8.1.9-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

  # Internal-only Chromium/CDP runtime for deterministic browser connectors.
  # Chromium's inner namespace sandbox is disabled because nested namespace
  # creation is blocked on the target Docker hosts. The container itself is the
  # isolation boundary: non-root image user, default Docker seccomp, no host port,
  # no privilege escalation, no Linux capabilities and a read-only rootfs.
  # The browser identity itself is intentionally durable: /home/chrome/profile
  # is a named volume so CRM device/MFA trust survives container recreation,
  # while caches/config/temp remain bounded tmpfs mounts.
  browser:
    build:
      context: ../..
      dockerfile: deploy/browser/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    shm_size: 1gb
    mem_limit: 2g
    pids_limit: 512
    volumes:
      - browser_profile:/home/chrome/profile
    tmpfs:
      - /home/chrome/.cache:rw,noexec,nosuid,size=128m,uid=10001,gid=10001
      - /home/chrome/.config:rw,noexec,nosuid,size=32m,uid=10001,gid=10001
      - /home/chrome/.local:rw,noexec,nosuid,size=32m,uid=10001,gid=10001
      - /home/chrome/.pki:rw,noexec,nosuid,size=16m,uid=10001,gid=10001
      - /tmp:rw,noexec,nosuid,size=256m,uid=10001,gid=10001
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9222/json/version"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s

  stt:
    build:
      context: ../..
      dockerfile: deploy/stt/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1500m
    cpus: 2.5
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,uid=10002,gid=10002

  tts:
    build:
      context: ../..
      dockerfile: deploy/tts/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,uid=10003,gid=10003

volumes:
  caddy_data:
  caddy_config:
  db_data:
  redis_data:
  browser_profile:
