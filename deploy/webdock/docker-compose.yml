services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

  app:
    build:
      context: ../..
      dockerfile: deploy/webdock/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://amarktai:${DB_PASSWORD}@db:3306/amarktai_sales_assistant
      BROWSERLESS_WS_ENDPOINT: ws://browser:3000?token=${BROWSERLESS_TOKEN}
      GENIE_SCRIPTS_CONFIG_PATH: /app/config/genie-scripts.json
      GENIE_ARTIFACT_DIR: /app/data/genie-artifacts
    volumes:
      - ./config:/app/config:ro
      - ./files/screenshots:/app/data/genie-artifacts
    depends_on:
      db:
        condition: service_healthy
      browser:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/healthz >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build:
      context: ../..
      dockerfile: deploy/webdock/Dockerfile
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://amarktai:${DB_PASSWORD}@db:3306/amarktai_sales_assistant
      BROWSERLESS_WS_ENDPOINT: ws://browser:3000?token=${BROWSERLESS_TOKEN}
      GENIE_SCRIPTS_CONFIG_PATH: /app/config/genie-scripts.json
      GENIE_ARTIFACT_DIR: /app/data/genie-artifacts
      APP_INTERNAL_URL: http://app:3000
    command: ["/app/scripts/worker-run.sh"]
    volumes:
      - ./config:/app/config:ro
      - ./files/screenshots:/app/data/genie-artifacts
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
      browser:
        condition: service_started

  db:
    image: mariadb:11.7
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: amarktai_sales_assistant
      MARIADB_USER: amarktai
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20

  browser:
    image: ghcr.io/browserless/chromium:v2.42.0
    restart: unless-stopped
    environment:
      TOKEN: ${BROWSERLESS_TOKEN}
      CONCURRENT: 1
      QUEUED: 5
      TIMEOUT: 120000
      PREBOOT_CHROME: "true"
    shm_size: 1gb

volumes:
  caddy_data:
  caddy_config:
  db_data:
