name: Final Product Backend Repair

on:
  push:
    branches:
      - fix/final-complete-product

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'Implement final CRM commissioning backend repair'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-complete-product
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: pnpm
      - name: Apply focused backend repair
        run: python3 .github/scripts/final_backend_repair.py
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Focused CRM tests
        run: pnpm exec vitest run server/crm/automaticCommissioning.test.ts server/crm/capabilityAccounting.test.ts
      - name: TypeScript
        run: pnpm check
      - name: Full unit tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: Commit exact tested backend repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/final-product-backend-repair.yml
          rm .github/scripts/final_backend_repair.py
          git config user.name "Amarktai Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add server/crm/automaticCommissioning.ts server/crm/automaticCommissioning.test.ts server/crm/sync.ts server/crm/commissioningReadiness.ts server/crm/capabilityAccounting.ts server/crm/capabilityAccounting.test.ts .github/workflows/final-product-backend-repair.yml .github/scripts/final_backend_repair.py
          git diff --cached --check
          git commit -m "Implement final CRM commissioning backend repair"
          git push origin HEAD:fix/final-complete-product
