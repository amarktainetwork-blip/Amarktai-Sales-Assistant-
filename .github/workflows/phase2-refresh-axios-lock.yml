name: Phase 2 Refresh Patched Axios Lock

on:
  push:
    branches: ["fix/phase2-functional-baseline-20260930"]
    paths:
      - ".github/workflows/phase2-refresh-axios-lock.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase2-functional-baseline-20260930
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: pnpm
      - name: Upgrade axios to patched release
        run: pnpm update axios@^1.20.0
      - name: Verify audit
        run: pnpm audit --prod --audit-level high
      - name: Commit dependency refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git diff --cached --quiet && exit 0
          git commit -m "Update axios beyond current security advisories"
          git push origin HEAD:fix/phase2-functional-baseline-20260930
