name: Final production release gate 20260822 r2

on:
  push:
    branches: ["release/go-live-20260822"]
    paths: [".github/workflows/final-release-gate-20260822-r2.yml"]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/go-live-20260822
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: pnpm

      - name: Refresh patched lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "amarktai-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          pnpm install --lockfile-only
          git add package.json pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "security: lock patched production dependency graph"
            git push origin HEAD:release/go-live-20260822
          fi

      - name: Reconcile current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_code=$?
          set -e
          if [ "$merge_code" -ne 0 ] && [ -z "$(git diff --name-only --diff-filter=U)" ]; then exit 1; fi
          python3 <<'PY'
          from pathlib import Path
          import subprocess
          for name in subprocess.check_output(["git","diff","--name-only","--diff-filter=U"], text=True).splitlines():
              path=Path(name)
              if not path.exists():
                  r=subprocess.run(["git","checkout","--ours","--",name])
                  if r.returncode: subprocess.run(["git","rm","--",name],check=True)
                  continue
              try: text=path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  subprocess.run(["git","checkout","--ours","--",name],check=True); continue
              if "<<<<<<< " not in text:
                  subprocess.run(["git","checkout","--ours","--",name],check=True); continue
              out=[]; state="normal"
              for line in text.splitlines(keepends=True):
                  if line.startswith("<<<<<<< "): state="ours"
                  elif line.startswith("=======") and state=="ours": state="theirs"
                  elif line.startswith(">>>>>>> ") and state=="theirs": state="normal"
                  elif state in ("normal","ours"): out.append(line)
              if state!="normal": raise SystemExit(f"Unclosed conflict in {name}")
              path.write_text("".join(out),encoding="utf-8")
          PY
          git add -A
          [ -z "$(git diff --name-only --diff-filter=U)" ]
          ! grep -RInE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!pnpm-lock.yaml'
          pnpm install --lockfile-only
          git add package.json pnpm-lock.yaml

      - name: Complete release validation
        id: gates
        shell: bash
        run: |
          set +e
          REPORT=/tmp/final-release-validation.md
          : > "$REPORT"
          failures=0
          gate(){ name="$1"; shift; log="/tmp/r2-${name}.log"; "$@" >"$log" 2>&1; code=$?; if [ $code -eq 0 ]; then printf -- '- %s: PASS\n' "$name" >>"$REPORT"; else failures=$((failures+1)); printf -- '- %s: FAIL\n\n```text\n' "$name" >>"$REPORT"; tail -n 140 "$log" >>"$REPORT"; printf '\n```\n' >>"$REPORT"; fi; }
          {
            echo '# Final Amarktai Sales Assistant Release Validation — 2026-08-22'
            echo
            echo "- Release parent: \`$(git rev-parse HEAD)\`"
            echo "- Main parent: \`$(git rev-parse origin/main)\`"
            echo '- Repository: `amarktainetwork-blip/Amarktai-Sales-Assistant-`'
            echo
          } >>"$REPORT"
          gate frozen_install pnpm install --frozen-lockfile
          gate unit_tests pnpm test
          gate typescript pnpm check
          gate drizzle_check env DATABASE_URL=mysql://migration:placeholder@127.0.0.1:3306/amarktai pnpm exec drizzle-kit check
          cp -R drizzle /tmp/r2-drizzle-before
          gate drizzle_generate env DATABASE_URL=mysql://migration:placeholder@127.0.0.1:3306/amarktai pnpm exec drizzle-kit generate
          if diff -qr /tmp/r2-drizzle-before drizzle >/tmp/r2-drizzle-diff.log 2>&1; then printf -- '- migration_generation_clean: PASS\n' >>"$REPORT"; else failures=$((failures+1)); printf -- '- migration_generation_clean: FAIL\n' >>"$REPORT"; fi
          rm -rf drizzle && cp -R /tmp/r2-drizzle-before drizzle
          gate production_build pnpm build
          gate production_audit pnpm audit --prod --audit-level=high
          gate shell_syntax sh -n deploy/webdock/install.sh deploy/webdock/preflight.sh deploy/webdock/backup.sh deploy/webdock/restore.sh deploy/webdock/update.sh deploy/webdock/smoke-test.sh deploy/webdock/verify-production.sh
          if grep -RInE '(/manus-storage|BUILT_IN_FORGE|x-manus-user-session|vite-plugin-manus-runtime|manus\.computer|manuspre)' client/src server deploy --exclude-dir=node_modules >/tmp/r2-hosted.log 2>&1; then failures=$((failures+1)); printf -- '- hosted_runtime_scan: FAIL\n' >>"$REPORT"; else printf -- '- hosted_runtime_scan: PASS\n' >>"$REPORT"; fi
          if grep -RIn 'github.com/amarktainetwork-blip/Amarktai-Sales-Assistant.git' README.md docs deploy >/tmp/r2-repo.log 2>&1; then failures=$((failures+1)); printf -- '- canonical_repo_docs: FAIL\n' >>"$REPORT"; else printf -- '- canonical_repo_docs: PASS\n' >>"$REPORT"; fi
          if grep -RInE '(Course2Career|\bCyber\b|Amelia|447428000560)' client/src deploy README.md server --exclude='*.test.ts' --exclude-dir=presets >/tmp/r2-customer.log 2>&1; then failures=$((failures+1)); printf -- '- generic_product_scan: FAIL\n\n```text\n' >>"$REPORT"; cat /tmp/r2-customer.log >>"$REPORT"; printf '\n```\n' >>"$REPORT"; else printf -- '- generic_product_scan: PASS\n' >>"$REPORT"; fi
          if grep -E 'custom_api|csv_import' client/src/pages/Onboarding.tsx client/src/pages/ConnectionsV2.tsx >/tmp/r2-dead.log 2>&1; then failures=$((failures+1)); printf -- '- user_facing_connector_truth: FAIL\n' >>"$REPORT"; else printf -- '- user_facing_connector_truth: PASS\n' >>"$REPORT"; fi
          grep -Fq 'provider: z.enum(["genie", "hubspot", "salesforce", "pipedrive", "zoho", "custom_browser"])' server/routers.ts && printf -- '- connector_api_allowlist: PASS\n' >>"$REPORT" || { failures=$((failures+1)); printf -- '- connector_api_allowlist: FAIL\n' >>"$REPORT"; }
          grep -q 'Zoho CRM' client/src/pages/Home.tsx && grep -q 'Microsoft 365' client/src/pages/Home.tsx && printf -- '- public_connection_copy: PASS\n' >>"$REPORT" || { failures=$((failures+1)); printf -- '- public_connection_copy: FAIL\n' >>"$REPORT"; }
          cp deploy/webdock/configuration.template .env
          gate compose_full docker compose -f deploy/webdock/docker-compose.yml --env-file .env config
          gate compose_pilot docker compose -f deploy/webdock/docker-compose.pilot.yml --env-file .env config
          gate docker_build docker compose -f deploy/webdock/docker-compose.yml --env-file .env build app browser
          gate runtime_contents docker compose -f deploy/webdock/docker-compose.yml --env-file .env run --no-deps --rm app sh -eu -c 'test -f dist/migrate.js; test -f dist/verifyIntegrations.js; test -f drizzle/meta/_journal.json; test -f dist/public/index.html'
          rm -f .env
          gate diff_check git diff --check
          printf '\nFAILURES=%s\n' "$failures" >>"$REPORT"
          echo "failures=$failures" >>"$GITHUB_OUTPUT"
          cat "$REPORT"
          exit 0

      - name: Publish validated reconciliation
        if: steps.gates.outputs.failures == '0'
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/final-release-validation.md docs/final-release-validation-20260822.md
          rm -f docs/final-release-failure-20260822.md
          git rm .github/workflows/final-release-gate-20260822-r2.yml
          git add -A
          git commit -m "merge: finalize production-ready Sales Assistant release"
          git push origin HEAD:release/go-live-20260822

      - name: Publish blockers without merge
        if: steps.gates.outputs.failures != '0'
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/final-release-validation.md /tmp/r2-failure.md
          git merge --abort
          cp /tmp/r2-failure.md docs/final-release-failure-20260822.md
          git rm .github/workflows/final-release-gate-20260822-r2.yml
          git add docs/final-release-failure-20260822.md
          git commit -m "ci: record remaining final release blockers"
          git push origin HEAD:release/go-live-20260822
          exit 1
