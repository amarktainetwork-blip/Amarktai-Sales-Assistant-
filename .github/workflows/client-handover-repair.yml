    expect(today).toContain("requiresOwnerMapping: ownerIds.size === 0");
  });

  it("scopes the personal Customers endpoint by signed-in user", () => {
    expect(compact(routers)).toContain(compact("return listPersonalCrmCustomers({ userId: ctx.user.id"));
  });

