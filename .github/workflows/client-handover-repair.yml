name: Client handover repair

on:
  push:
    branches:
      - fix/client-handover-onboarding-assistant-scope

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/client-handover-onboarding-assistant-scope
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply focused repair
        shell: bash
        run: |
          # The Assistant has exactly two identical UI fallback occurrences.
          # Let the repair helper consume them one at a time while still failing
          # if an expected pattern is missing entirely.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/clientHandoverRepair.py')
          text = p.read_text()
          old = '    if count != 1:\n'
          if old not in text:
              raise SystemExit('repair helper guard not found')
          p.write_text(text.replace(old, '    if count < 1:\n', 1))
          PY
          python3 scripts/clientHandoverRepair.py
          if grep -Fq 'response.content || "I’m ready. What would you like to do next?"' client/src/pages/Assistant.tsx; then
            echo 'CANNED_ASSISTANT_FALLBACK_REMAINS=YES'
            exit 1
          fi

      - name: Format changed product files
        run: |
          pnpm exec prettier --write \
            server/assistantRoutes.ts \
            server/today.ts \
            server/personalCrmCustomers.ts \
            server/routers.ts \
            client/src/pages/Assistant.tsx \
            client/src/pages/Onboarding.tsx \
            client/src/pages/CrmWorkspace.tsx \
            README.md

      - name: TypeScript
        run: pnpm check

      - name: Tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Commit tested repair
        shell: bash
        run: |
          rm -f scripts/clientHandoverRepair.py .github/workflows/client-handover-repair.yml
          git add -A
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: complete client handover onboarding and salesperson scope'
          git push origin HEAD:fix/client-handover-onboarding-assistant-scope
