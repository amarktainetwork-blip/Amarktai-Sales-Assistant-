name: Client handover repair

on:
  push:
    branches:
      - fix/client-handover-onboarding-assistant-scope

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/client-handover-onboarding-assistant-scope
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
