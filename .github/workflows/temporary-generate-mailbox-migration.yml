name: Temporary mailbox migration generator

on:
  push:
    branches: ["fix/client-handover-mailbox-readiness-ui"]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/client-handover-mailbox-readiness-ui
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Extend personal mailbox schema safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('drizzle/schema.ts')
          text = path.read_text()
          old_provider = 'provider: mysqlEnum("provider", ["microsoft"]).notNull(),'
          new_provider = 'provider: mysqlEnum("provider", ["microsoft", "google", "smtp"]).notNull(),'
          if text.count(old_provider) != 1:
              raise SystemExit('Expected exactly one Microsoft-only mailbox provider enum')
          text = text.replace(old_provider, new_provider, 1)
          marker = '    redirectUri: varchar("redirectUri", { length: 1024 }).notNull(),\n    expiresAt: timestamp("expiresAt").notNull(),'
          replacement = '    redirectUri: varchar("redirectUri", { length: 1024 }).notNull(),\n    provider: mysqlEnum("provider", ["microsoft", "google"])\n      .notNull()\n      .default("microsoft"),\n    expiresAt: timestamp("expiresAt").notNull(),'
          if text.count(marker) != 1:
              raise SystemExit('Expected exactly one mailbox OAuth state redirect marker')
          text = text.replace(marker, replacement, 1)
          path.write_text(text)
          PY
      - name: Generate Drizzle migration
        env:
          DATABASE_URL: mysql://migration:placeholder@127.0.0.1:3306/amarktai
        run: pnpm exec drizzle-kit generate --name provider_neutral_personal_mailbox
      - name: Commit generated schema and migration metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle
          git diff --cached --quiet && exit 0
          git commit -m "Add provider-neutral personal mailbox schema"
          git push origin HEAD:fix/client-handover-mailbox-readiness-ui
