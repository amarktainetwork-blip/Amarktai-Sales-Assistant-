name: Connection-Scoped Browser Sessions

on:
  pull_request:
  push:
    branches: [main, "release/**"]

permissions:
  contents: read

jobs:
  verify-persistent-browser-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare production compose inputs
        run: |
          cp deploy/webdock/configuration.template .env
          mkdir -p deploy/webdock/config deploy/webdock/files/connector-evidence
          cp deploy/webdock/genie-scripts.template.json deploy/webdock/config/genie-scripts.json
          chmod 644 deploy/webdock/config/genie-scripts.json
          docker compose -f deploy/webdock/docker-compose.yml --env-file .env config >/dev/null
      - name: Build app and browser images
        run: docker compose -f deploy/webdock/docker-compose.yml --env-file .env build app browser
      - name: Prove isolated connection-scoped browser sessions
        shell: bash
        run: |
          set -euo pipefail
          COMPOSE="docker compose -f deploy/webdock/docker-compose.yml --env-file .env"
          $COMPOSE up -d browser

          wait_for_browser() {
            local cid
            cid="$($COMPOSE ps -q browser)"
            for attempt in $(seq 1 40); do
              status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}starting{{end}}' "$cid")"
              [ "$status" = healthy ] && return 0
              [ "$status" = unhealthy ] && break
              sleep 2
            done
            $COMPOSE logs --no-color browser
            docker inspect "$cid" --format '{{json .State}}'
            return 1
          }

          wait_for_browser
          cid="$($COMPOSE ps -q browser)"
          ! docker inspect --format '{{json .Mounts}}' "$cid" | grep -q '"Destination":"/home/chrome/profile"'
          docker inspect --format '{{json .Config.Cmd}}' "$cid" | grep -q -- '--user-data-dir=/tmp/chrome-profile'
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$cid")" = "true"
          test -z "$(docker port "$cid")"

          # Prove the new universal contract: each active connection receives an
          # isolated BrowserContext, only its explicit session package restores
          # its state, and a fresh connection cannot inherit another CRM cookie.
          $COMPOSE run --no-deps --rm app node --input-type=module -e '
            import { chromium } from "playwright-core";
            const browser = await chromium.connectOverCDP("http://browser:9222");
            const connectionA = await browser.newContext();
            await connectionA.addCookies([{ name: "crm_session", value: "organisation-7-connection-11", domain: "crm-a.example", path: "/", secure: true, httpOnly: true }]);
            const packageA = await connectionA.storageState();
            await connectionA.close();

            const restoredA = await browser.newContext({ storageState: packageA });
            const restoredCookies = await restoredA.cookies("https://crm-a.example/");
            if (restoredCookies.find(cookie => cookie.name === "crm_session")?.value !== "organisation-7-connection-11") throw new Error("connection-scoped package did not restore");

            const connectionB = await browser.newContext();
            const crossover = await connectionB.cookies("https://crm-a.example/");
            if (crossover.some(cookie => cookie.name === "crm_session")) throw new Error("CRM session crossed connection boundary");
            if (restoredA === connectionB) throw new Error("connections reused one BrowserContext");

            await restoredA.close();
            await connectionB.close();
            console.log("CONNECTION_SCOPED_BROWSER_SESSION=PASS");
            process.exit(0);
          '
