name: Persistent Browser Profile

on:
  pull_request:
  push:
    branches: [main, "release/**"]

permissions:
  contents: read

jobs:
  verify-persistent-browser-profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare production compose inputs
        run: |
          cp deploy/webdock/configuration.template .env
          mkdir -p deploy/webdock/config deploy/webdock/files/connector-evidence
          cp deploy/webdock/genie-scripts.template.json deploy/webdock/config/genie-scripts.json
          chmod 644 deploy/webdock/config/genie-scripts.json
          docker compose -f deploy/webdock/docker-compose.yml --env-file .env config >/dev/null
      - name: Build app and browser images
        run: docker compose -f deploy/webdock/docker-compose.yml --env-file .env build app browser
      - name: Prove live page handoff and durable profile volume
        shell: bash
        run: |
          set -euo pipefail
          COMPOSE="docker compose -f deploy/webdock/docker-compose.yml --env-file .env"
          $COMPOSE up -d browser

          wait_for_browser() {
            local cid
            cid="$($COMPOSE ps -q browser)"
            for attempt in $(seq 1 40); do
              status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}starting{{end}}' "$cid")"
              [ "$status" = healthy ] && return 0
              [ "$status" = unhealthy ] && break
              sleep 2
            done
            $COMPOSE logs --no-color browser
            docker inspect "$cid" --format '{{json .State}}'
            return 1
          }

          wait_for_browser
          cid="$($COMPOSE ps -q browser)"
          docker inspect --format '{{json .Mounts}}' "$cid" | grep -q '"Destination":"/home/chrome/profile"'
          docker inspect --format '{{json .Mounts}}' "$cid" | grep -q '"Type":"volume"'
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$cid")" = "true"
          test -z "$(docker port "$cid")"

          # The critical Genie guarantee: the browser lives independently of an
          # app/CDP client. Create one page, let that client process exit, then
          # reconnect from a completely new app container and prove the exact
          # page is still present and usable. This models the retained MFA tab.
          $COMPOSE run --no-deps --rm app node --input-type=module -e '
            import { chromium } from "playwright-core";
            const browser = await chromium.connectOverCDP("http://browser:9222");
            const contexts = browser.contexts();
            if (contexts.length !== 1) throw new Error(`expected one persistent context, got ${contexts.length}`);
            const page = await contexts[0].newPage();
            await page.goto("data:text/html,<title>amarktai-live-page-probe</title><h1 id=probe>retained-live-page</h1>");
            if (await page.textContent("#probe") !== "retained-live-page") throw new Error("live page probe was not created");
            process.exit(0);
          '

          $COMPOSE run --no-deps --rm app node --input-type=module -e '
            import { chromium } from "playwright-core";
            const browser = await chromium.connectOverCDP("http://browser:9222");
            const contexts = browser.contexts();
            if (contexts.length !== 1) throw new Error(`expected one persistent context after reconnect, got ${contexts.length}`);
            let retained;
            for (const page of contexts[0].pages()) {
              if ((await page.title().catch(() => "")) === "amarktai-live-page-probe") {
                retained = page;
                break;
              }
            }
            if (!retained) throw new Error("exact browser page did not survive CDP client reconnect");
            if (await retained.textContent("#probe") !== "retained-live-page") throw new Error("retained browser page was not usable after reconnect");
            console.log("LIVE_BROWSER_PAGE_HANDOFF=PASS");
            await retained.close();
            process.exit(0);
          '

          # The named profile volume is a separate durability property. Prove
          # its filesystem survives a Chromium/container restart without making
          # the false claim that an in-memory authenticated tab survives that
          # process restart too.
          docker exec "$cid" sh -c 'printf "%s" "durable-profile-volume" > /home/chrome/profile/.amarktai-volume-probe'
          test "$(docker exec "$cid" cat /home/chrome/profile/.amarktai-volume-probe)" = "durable-profile-volume"

          $COMPOSE restart browser
          wait_for_browser
          cid="$($COMPOSE ps -q browser)"
          test "$(docker exec "$cid" cat /home/chrome/profile/.amarktai-volume-probe)" = "durable-profile-volume"
          echo "BROWSER_PROFILE_VOLUME=PASS"

          # After a Chromium process restart the exact live tab is intentionally
          # considered lost. Genie runtime code must fail closed rather than
          # manufacture a replacement page and trigger repeated MFA.
          $COMPOSE run --no-deps --rm app node --input-type=module -e '
            import { chromium } from "playwright-core";
            const browser = await chromium.connectOverCDP("http://browser:9222");
            const contexts = browser.contexts();
            if (contexts.length !== 1) throw new Error(`expected one persistent context after browser restart, got ${contexts.length}`);
            for (const page of contexts[0].pages()) {
              if ((await page.title().catch(() => "")) === "amarktai-live-page-probe") throw new Error("live-page probe unexpectedly survived Chromium process restart");
            }
            console.log("BROWSER_RESTART_INVALIDATES_LIVE_PAGE=PASS");
            process.exit(0);
          '
