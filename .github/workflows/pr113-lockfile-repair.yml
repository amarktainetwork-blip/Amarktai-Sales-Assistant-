name: PR113 lockfile repair

on:
  push:
    branches:
      - fix/restore-approved-dashboard-knowledge-flow

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/restore-approved-dashboard-knowledge-flow
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: pnpm
      - name: Regenerate Nodemailer dependency and lockfile
        run: pnpm add 'nodemailer@^9.1.1' --save-prod --lockfile-only
      - name: Commit security patch and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr113-lockfile-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-lock.yaml .github/workflows/pr113-lockfile-repair.yml
          git diff --cached --check
          git diff --cached --quiet && { echo 'No lockfile changes produced.' >&2; exit 1; }
          git commit -m 'chore: patch Nodemailer security advisory'
          git push origin HEAD:fix/restore-approved-dashboard-knowledge-flow
