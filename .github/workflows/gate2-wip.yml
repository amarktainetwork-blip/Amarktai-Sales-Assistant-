name: Gate 2 WIP

on:
  push:
    branches: ["fix/complete-client-action-flow"]

permissions:
  contents: write

jobs:
  gate2:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: pnpm

      - name: Apply Gate 2 wiring
        run: python scripts/gate2_patch.py
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Gate 2 unit tests
        run: pnpm test
      - name: Gate 2 TypeScript
        run: pnpm check
      - name: Gate 2 production build
        run: pnpm build
      - name: Review wiring proof
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'InlineCrmReview from "@/components/InlineCrmReview"' client/src/pages/CrmWorkspace.tsx
          grep -F '<InlineCrmReview workflowRunId={assistantWorkflowRunId} />' client/src/pages/CrmWorkspace.tsx
          grep -F 'unverifiedFailure: true' server/routers.ts
          grep -F 'Approved / executing' client/src/pages/Reviews.tsx
          grep -F 'Evidence, safeguards and history' client/src/pages/Reviews.tsx
          grep -F 'Why a reply is needed' client/src/pages/Reviews.tsx
          grep -F 'Approve change' client/src/pages/Reviews.tsx
          grep -F 'Apply approved change' client/src/pages/Reviews.tsx
          git diff --check

      - name: Commit validated Gate 2 wiring
        shell: bash
        run: |
          set -euo pipefail
          files=(client/src/pages/CrmWorkspace.tsx client/src/pages/Reviews.tsx server/routers.ts)
          if git diff --quiet -- "${files[@]}"; then
            echo "Gate 2 Review wiring is already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git commit -m "Complete inline CRM Review action lifecycle"
          git push origin HEAD:fix/complete-client-action-flow
