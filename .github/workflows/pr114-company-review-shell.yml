name: PR114 company review shell

on:
  push:
    branches:
      - fix/client-handover-onboarding-assistant-scope

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/client-handover-onboarding-assistant-scope
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply review-shell repair
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('client/src/pages/CompanySetup.tsx')
          text = p.read_text()
          old = '''    <DashboardLayout>\n      <div\n        data-company-knowledge-report\n        className="mx-auto max-w-5xl space-y-5 text-[#26354A]"\n      >\n'''
          new = '''    <DashboardLayout>\n      <div\n        data-company-knowledge-review-shell\n        className="fixed inset-0 z-[240] overflow-y-auto bg-[#F4F7FB]"\n      >\n        <div\n          data-company-knowledge-report\n          className="mx-auto max-w-5xl space-y-5 px-4 py-8 text-[#26354A] sm:px-6 lg:px-8"\n        >\n'''
          if text.count(old) != 1:
              raise SystemExit(f'company review opening shell match count={text.count(old)}')
          text = text.replace(old, new, 1)
          old_close = '''        </section>\n      </div>\n    </DashboardLayout>\n  );\n}\n\nfunction ReportSection'''
          new_close = '''        </section>\n        </div>\n      </div>\n    </DashboardLayout>\n  );\n}\n\nfunction ReportSection'''
          if text.count(old_close) != 1:
              raise SystemExit(f'company review closing shell match count={text.count(old_close)}')
          p.write_text(text.replace(old_close, new_close, 1))

          t = Path('server/clientHandoverAcceptance.test.ts')
          tests = t.read_text()
          old_import = 'const crm = fs.readFileSync("client/src/pages/CrmWorkspace.tsx", "utf8");\n'
          new_import = old_import + 'const companySetup = fs.readFileSync("client/src/pages/CompanySetup.tsx", "utf8");\n'
          if tests.count(old_import) != 1:
              raise SystemExit('acceptance import anchor missing')
          tests = tests.replace(old_import, new_import, 1)
          anchor = '''  it("shows CRM learning and requires salesperson identity mapping", () => {\n    expect(crm).toContain("AmarktAI is learning");\n    expect(crm).toContain("/api/team/crm-identity");\n    expect(crm).toContain("!crmIdentityMapped");\n  });\n'''
          addition = anchor + '''\n  it("keeps company knowledge review in the onboarding shell instead of exposing the dashboard sidebar", () => {\n    expect(companySetup).toContain("data-company-knowledge-review-shell");\n    expect(companySetup).toContain("fixed inset-0 z-[240]");\n    expect(companySetup).toContain("data-company-knowledge-report");\n  });\n'''
          if tests.count(anchor) != 1:
              raise SystemExit('acceptance test anchor missing')
          t.write_text(tests.replace(anchor, addition, 1))
          PY
      - name: Format
        run: pnpm exec prettier --write client/src/pages/CompanySetup.tsx server/clientHandoverAcceptance.test.ts
      - name: TypeScript
        run: pnpm check
      - name: Tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: Commit tested frontend repair
        shell: bash
        run: |
          rm -f .github/workflows/pr114-company-review-shell.yml
          git add -A
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: keep company review inside onboarding shell'
          git push origin HEAD:fix/client-handover-onboarding-assistant-scope
