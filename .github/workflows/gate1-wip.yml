name: Gate 1 WIP
# Exact-head validation trigger after persisted Gate 1 action wiring.

on:
  push:
    branches: ["fix/complete-client-action-flow"]

permissions:
  contents: write

jobs:
  gate1:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: pnpm

      - name: Wire CRM-side Assistant to canonical governed entry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("server/routers.ts")
          text = path.read_text()
          old = 'import { prepareGovernedAssistantRequest } from "./governedAssistant";'
          new = 'import { prepareGovernedAssistantRequest } from "./governedAssistantEntry";'
          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit("CRM-side Assistant import could not be located safely")
          PY
          grep -F 'from "./governedAssistantEntry"' server/routers.ts
          grep -F 'from "./governedAssistantEntry"' server/assistantActionRoute.ts

      - name: Apply narrow Gate 1 TypeScript fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          communications = Path("server/communications.ts")
          text = communications.read_text()
          old = '  const channel = message.channel === "whatsapp" ? "chat" : message.channel;'
          new = '  const channel: "email" | "sms" | "chat" =\n    message.channel === "whatsapp" ? "chat" : message.channel;'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("Suppression channel narrowing could not be located safely")
          communications.write_text(text)

          execution = Path("server/crm/canonicalActionExecution.ts")
          text = execution.read_text()
          contact_old = '    const current = contact\n      ? {'
          contact_new = '    const current: Record<string, unknown> = contact\n      ? {'
          opportunity_old = '    const current = opportunity\n      ? {'
          opportunity_new = '    const current: Record<string, unknown> = opportunity\n      ? {'
          if contact_old in text:
              text = text.replace(contact_old, contact_new, 1)
          elif contact_new not in text:
              raise SystemExit("Contact readback narrowing could not be located safely")
          if opportunity_old in text:
              text = text.replace(opportunity_old, opportunity_new, 1)
          elif opportunity_new not in text:
              raise SystemExit("Opportunity readback narrowing could not be located safely")
          execution.write_text(text)

          readback = Path("server/delegatedMailboxReadback.ts")
          text = readback.read_text()
          page_old = '    const page = await delegatedMicrosoftGraphRequest<SentPage>('
          page_new = '    const page: SentPage = await delegatedMicrosoftGraphRequest<SentPage>('
          rows_old = '    const rows = page.value || [];'
          rows_new = '    const rows: SentMessage[] = page.value || [];'
          if page_old in text:
              text = text.replace(page_old, page_new, 1)
          elif page_new not in text:
              raise SystemExit("Sent Items page annotation could not be located safely")
          if rows_old in text:
              text = text.replace(rows_old, rows_new, 1)
          elif rows_new not in text:
              raise SystemExit("Sent Items row annotation could not be located safely")
          readback.write_text(text)
          PY

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Gate 1 unit tests
        run: pnpm test
      - name: Gate 1 TypeScript
        run: pnpm check
      - name: Gate 1 production build
        run: pnpm build
      - name: Guard generic engine against client acceptance constants
        shell: bash
        run: |
          set -euo pipefail
          files=(
            server/clientActionConfiguration.ts
            server/configuredWorkflow.ts
            server/governedAssistantEntry.ts
            server/crm/actionExecutionPreconditions.ts
            server/crm/canonicalActionExecution.ts
          )
          if grep -nEi 'Course2Career|Yes/No Cyber|Last Try Cyber|Discovery Completed|Failed Follow-up Cyber|tried_to_email|\+447428000560' "${files[@]}"; then
            echo "Client-specific acceptance constants leaked into the generic Gate 1 engine." >&2
            exit 1
          fi
      - name: Diff sanity
        run: git diff --check

      - name: Commit validated Gate 1 wiring and narrowings
        shell: bash
        run: |
          set -euo pipefail
          files=(
            server/routers.ts
            server/communications.ts
            server/crm/canonicalActionExecution.ts
            server/delegatedMailboxReadback.ts
          )
          if git diff --quiet -- "${files[@]}"; then
            echo "Canonical Gate 1 wiring and TypeScript narrowings are already committed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git commit -m "Finalize canonical Gate 1 action wiring"
          git push origin HEAD:fix/complete-client-action-flow
