name: Temporary frontend normalization

on:
  push:
    branches: ["fix/client-handover-frontend-crm-outlook"]

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.head_commit.message == 'Run frontend normalization'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/client-handover-frontend-crm-outlook
          fetch-depth: 0
      - name: Normalize client wording
        run: python .github/scripts/temporary_frontend_normalize.py
      - name: Commit normalized client wording
        run: |
          if git diff --quiet; then
            echo "No wording changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add client/src
          git commit -m "Normalize AmarktAI workspace wording"
          git push origin HEAD:fix/client-handover-frontend-crm-outlook
