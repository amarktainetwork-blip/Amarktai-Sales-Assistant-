name: CI

on:
  pull_request:
  push:
    branches: [main, "release/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test
      - name: TypeScript
        run: pnpm check
      - name: Enforce MariaDB identifier limit
        run: node scripts/check-mariadb-identifiers.mjs
      - name: Validate Drizzle schema and migrations
        env:
          DATABASE_URL: mysql://migration:placeholder@127.0.0.1:3306/amarktai
        run: pnpm exec drizzle-kit check
      - name: Verify migration generation is clean
        env:
          DATABASE_URL: mysql://migration:placeholder@127.0.0.1:3306/amarktai
        run: |
          pnpm exec drizzle-kit generate
          git diff --exit-code -- drizzle
      - name: Production build
        run: pnpm build
      - name: Reject server secrets in compiled frontend
        run: node scripts/check-frontend-secrets.mjs
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high
      - name: Validate deployment shell scripts
        run: sh -n deploy/webdock/quick-install.sh deploy/webdock/install.sh deploy/webdock/preflight.sh deploy/webdock/backup.sh deploy/webdock/restore.sh deploy/webdock/update.sh deploy/webdock/smoke-test.sh deploy/webdock/verify-production.sh
      - name: Block hosted preview/runtime dependencies from production source
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '(/manus-storage|BUILT_IN_FORGE|x-manus-user-session|vite-plugin-manus-runtime|manus\.computer|manuspre)' client/src server deploy --exclude-dir=node_modules; then
            echo "Forbidden hosted preview/runtime dependency remains in production source." >&2
            exit 1
          fi
      - name: Enforce canonical repository in operator docs
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn 'github.com/amarktainetwork-blip/Amarktai-Sales-Assistant.git' README.md docs deploy; then
            echo "Operator documentation still references the wrong non-hyphen repository." >&2
            exit 1
          fi
      - name: Validate Webdock Compose profiles
        run: |
          cp deploy/webdock/configuration.template .env
          docker compose -f deploy/webdock/docker-compose.yml --env-file .env config >/dev/null
          docker compose -f deploy/webdock/docker-compose.pilot.yml --env-file .env config >/dev/null
      - name: Build Webdock production images
        run: docker compose -f deploy/webdock/docker-compose.yml --env-file .env build app browser
      - name: Verify production image runtime entrypoints
        run: |
          docker compose -f deploy/webdock/docker-compose.yml --env-file .env run --no-deps --rm --entrypoint sh app -eu -c '
            test -f dist/_core/index.js
            test -f dist/genie/healthWorker.js
            test -f dist/reportSchedulerWorker.js
            test -f dist/compliance/retentionWorker.js
            test -f dist/migrate.js
            test -f dist/verifyIntegrations.js
            test -f drizzle/meta/_journal.json
            test -f dist/public/index.html
          '
      - name: Prove fresh MariaDB production migrations
        shell: bash
        run: |
          set -euo pipefail
          COMPOSE="docker compose -f deploy/webdock/docker-compose.yml --env-file .env"
          $COMPOSE up -d db
          cid="$($COMPOSE ps -q db)"
          for attempt in $(seq 1 30); do
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}starting{{end}}' "$cid")"
            if [ "$status" = "healthy" ]; then
              $COMPOSE run --no-deps --rm app node dist/migrate.js
              $COMPOSE run --no-deps --rm app node dist/migrate.js
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              break
            fi
            sleep 2
          done
          $COMPOSE logs --no-color db
          docker inspect "$cid" --format '{{json .State}}'
          exit 1
      - name: Prove hardened Webdock Chromium CDP runtime
        shell: bash
        run: |
          set -euo pipefail
          COMPOSE="docker compose -f deploy/webdock/docker-compose.yml --env-file .env"
          $COMPOSE up -d browser
          cid="$($COMPOSE ps -q browser)"
          for attempt in $(seq 1 30); do
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}starting{{end}}' "$cid")"
            if [ "$status" = "healthy" ]; then
              docker exec "$cid" curl -fsS http://127.0.0.1:9222/json/version >/dev/null
              test "$(docker exec "$cid" id -u)" = "10001"
              test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' "$cid")" = "true"
              docker inspect --format '{{json .HostConfig.CapDrop}}' "$cid" | grep -q '"ALL"'
              docker inspect --format '{{json .HostConfig.SecurityOpt}}' "$cid" | grep -q 'no-new-privileges:true'
              test -z "$(docker port "$cid")"
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              break
            fi
            sleep 2
          done
          $COMPOSE logs --no-color browser
          docker inspect "$cid" --format '{{json .State}}'
          exit 1
      - name: Prove production app and worker runtime
        shell: bash
        run: |
          set -euo pipefail
          COMPOSE="docker compose -f deploy/webdock/docker-compose.yml --env-file .env"
          mkdir -p deploy/webdock/config deploy/webdock/files/connector-evidence
          cp deploy/webdock/genie-scripts.template.json deploy/webdock/config/genie-scripts.json
          chmod 644 deploy/webdock/config/genie-scripts.json
          $COMPOSE up -d app worker reporter
          app_cid="$($COMPOSE ps -q app)"
          worker_cid="$($COMPOSE ps -q worker)"
          reporter_cid="$($COMPOSE ps -q reporter)"
          for attempt in $(seq 1 30); do
            app_health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}starting{{end}}' "$app_cid")"
            worker_state="$(docker inspect --format '{{.State.Status}}' "$worker_cid")"
            reporter_state="$(docker inspect --format '{{.State.Status}}' "$reporter_cid")"
            if [ "$app_health" = "healthy" ] && [ "$worker_state" = "running" ] && [ "$reporter_state" = "running" ]; then
              sleep 5
              test "$(docker inspect --format '{{.State.Status}}' "$worker_cid")" = "running"
              test "$(docker inspect --format '{{.State.Status}}' "$reporter_cid")" = "running"
              docker exec "$app_cid" node -e "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
              exit 0
            fi
            if [ "$(docker inspect --format '{{.State.Status}}' "$app_cid")" = "exited" ]; then
              break
            fi
            sleep 2
          done
          $COMPOSE ps
          $COMPOSE logs --no-color --tail=200 app worker reporter
          exit 1
      - name: Diff sanity
        run: git diff --check
