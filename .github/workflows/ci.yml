name: CI

on:
  pull_request:
  push:
    branches: [main, "release/**"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests
        run: pnpm test
      - name: TypeScript
        run: pnpm check
      - name: Validate Drizzle schema and migrations
        env:
          DATABASE_URL: mysql://migration:placeholder@127.0.0.1:3306/amarktai
        run: pnpm exec drizzle-kit check
      - name: Verify migration generation is clean
        env:
          DATABASE_URL: mysql://migration:placeholder@127.0.0.1:3306/amarktai
        run: |
          pnpm exec drizzle-kit generate
          git diff --exit-code -- drizzle
      - name: Production build
        run: pnpm build
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high
      - name: Validate deployment shell scripts
        run: sh -n deploy/webdock/quick-install.sh deploy/webdock/install.sh deploy/webdock/preflight.sh deploy/webdock/backup.sh deploy/webdock/restore.sh deploy/webdock/update.sh deploy/webdock/smoke-test.sh deploy/webdock/verify-production.sh
      - name: Block hosted preview/runtime dependencies from production source
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '(/manus-storage|BUILT_IN_FORGE|x-manus-user-session|vite-plugin-manus-runtime|manus\.computer|manuspre)' client/src server deploy --exclude-dir=node_modules; then
            echo "Forbidden hosted preview/runtime dependency remains in production source." >&2
            exit 1
          fi
      - name: Enforce canonical repository in operator docs
        shell: bash
        run: |
          set -euo pipefail
          if grep -RIn 'github.com/amarktainetwork-blip/Amarktai-Sales-Assistant.git' README.md docs deploy; then
            echo "Operator documentation still references the wrong non-hyphen repository." >&2
            exit 1
          fi
      - name: Validate Webdock Compose profiles
        run: |
          cp deploy/webdock/configuration.template .env
          docker compose -f deploy/webdock/docker-compose.yml --env-file .env config >/dev/null
          docker compose -f deploy/webdock/docker-compose.pilot.yml --env-file .env config >/dev/null
      - name: Build Webdock production images
        run: docker compose -f deploy/webdock/docker-compose.yml --env-file .env build app browser
      - name: Verify production image contains runtime migrations and verifiers
        run: |
          docker compose -f deploy/webdock/docker-compose.yml --env-file .env run --no-deps --rm app sh -eu -c 'test -f dist/migrate.js; test -f dist/verifyIntegrations.js; test -f drizzle/meta/_journal.json; test -f dist/public/index.html'
      - name: Diff sanity
        run: git diff --check
