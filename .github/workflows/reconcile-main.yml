name: Reconcile production release with main

on:
  push:
    branches: ["release/go-live-20260822"]
    paths: [".github/workflows/reconcile-main.yml"]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/go-live-20260822
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: pnpm
      - name: Merge main and resolve only true conflict hunks from the release side
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "amarktai-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          merge_code=$?
          set -e
          if [ "$merge_code" -ne 0 ] && [ -z "$(git diff --name-only --diff-filter=U)" ]; then
            echo "Merge failed without resolvable text conflicts." >&2
            exit 1
          fi
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          conflicted = subprocess.check_output(["git", "diff", "--name-only", "--diff-filter=U"], text=True).splitlines()
          for name in conflicted:
              path = Path(name)
              if not path.exists():
                  result = subprocess.run(["git", "checkout", "--ours", "--", name])
                  if result.returncode != 0:
                      subprocess.run(["git", "rm", "--", name], check=True)
                  continue
              raw = path.read_bytes()
              try:
                  text = raw.decode("utf-8")
              except UnicodeDecodeError:
                  subprocess.run(["git", "checkout", "--ours", "--", name], check=True)
                  continue
              if "<<<<<<< " not in text:
                  subprocess.run(["git", "checkout", "--ours", "--", name], check=True)
                  continue
              if "||||||| " in text:
                  raise SystemExit(f"Unexpected diff3 conflict marker in {name}")
              output = []
              state = "normal"
              for line in text.splitlines(keepends=True):
                  if line.startswith("<<<<<<< "):
                      if state != "normal": raise SystemExit(f"Nested conflict in {name}")
                      state = "ours"
                  elif line.startswith("=======") and state == "ours":
                      state = "theirs"
                  elif line.startswith(">>>>>>> ") and state == "theirs":
                      state = "normal"
                  elif state in ("normal", "ours"):
                      output.append(line)
              if state != "normal": raise SystemExit(f"Unclosed conflict in {name}")
              path.write_text("".join(output), encoding="utf-8")
          PY
          git add -A
          unresolved="$(git diff --name-only --diff-filter=U)"
          [ -z "$unresolved" ] || { echo "Unresolved conflicts:"; echo "$unresolved"; exit 1; }
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' -- . ':!pnpm-lock.yaml'; then
            echo "Conflict markers remain." >&2
            exit 1
          fi
      - name: Run release gates and write evidence
        id: gates
        shell: bash
        run: |
          set +e
          REPORT=/tmp/reconcile-validation.md
          : > "$REPORT"
          printf '# Release/Main reconciliation validation\n\n' >> "$REPORT"
          printf -- '- Release head before merge: `%s`\n' "${{ github.sha }}" >> "$REPORT"
          printf -- '- Main merged: `%s`\n\n' "$(git rev-parse origin/main)" >> "$REPORT"
          failures=0
          gate() {
            name="$1"; shift
            log="/tmp/gate-$(printf '%s' "$name" | tr ' /' '__').log"
            printf 'Running %s...\n' "$name"
            "$@" >"$log" 2>&1
            code=$?
            if [ "$code" -eq 0 ]; then
              printf -- '- %s: PASS\n' "$name" >> "$REPORT"
            else
              failures=$((failures+1))
              printf -- '- %s: FAIL\n\n```text\n' "$name" >> "$REPORT"
              tail -n 80 "$log" >> "$REPORT"
              printf '\n```\n' >> "$REPORT"
            fi
          }
          gate locked_install pnpm install --frozen-lockfile
          gate unit_tests pnpm test
          gate typescript pnpm check
          gate drizzle_check env DATABASE_URL=mysql://migration:placeholder@127.0.0.1:3306/amarktai pnpm exec drizzle-kit check
          cp -R drizzle /tmp/drizzle-before
          gate drizzle_generate env DATABASE_URL=mysql://migration:placeholder@127.0.0.1:3306/amarktai pnpm exec drizzle-kit generate
          if diff -qr /tmp/drizzle-before drizzle >/tmp/drizzle-diff.log 2>&1; then
            printf -- '- migration_generation_clean: PASS\n' >> "$REPORT"
          else
            failures=$((failures+1)); printf -- '- migration_generation_clean: FAIL\n\n```text\n' >> "$REPORT"; tail -n 80 /tmp/drizzle-diff.log >> "$REPORT"; printf '\n```\n' >> "$REPORT"
          fi
          rm -rf drizzle && cp -R /tmp/drizzle-before drizzle
          gate production_build pnpm build
          gate production_audit pnpm audit --prod --audit-level=high
          gate shell_syntax sh -n deploy/webdock/install.sh deploy/webdock/preflight.sh deploy/webdock/backup.sh deploy/webdock/update.sh deploy/webdock/smoke-test.sh deploy/webdock/verify-production.sh
          if grep -RInE '(/manus-storage|BUILT_IN_FORGE|x-manus-user-session|vite-plugin-manus-runtime|manus\.computer|manuspre)' client/src server deploy --exclude-dir=node_modules >/tmp/forbidden.log 2>&1; then
            failures=$((failures+1)); printf -- '- hosted_runtime_scan: FAIL\n\n```text\n' >> "$REPORT"; cat /tmp/forbidden.log >> "$REPORT"; printf '\n```\n' >> "$REPORT"
          else
            printf -- '- hosted_runtime_scan: PASS\n' >> "$REPORT"
          fi
          cp deploy/webdock/configuration.template .env
          gate compose_full docker compose -f deploy/webdock/docker-compose.yml --env-file .env config
          gate compose_pilot docker compose -f deploy/webdock/docker-compose.pilot.yml --env-file .env config
          gate docker_build docker compose -f deploy/webdock/docker-compose.yml --env-file .env build app browser
          gate runtime_contents docker compose -f deploy/webdock/docker-compose.yml --env-file .env run --no-deps --rm app sh -eu -c 'test -f dist/migrate.js; test -f dist/verifyIntegrations.js; test -f drizzle/meta/_journal.json; test -f dist/public/index.html'
          rm -f .env
          gate diff_check git diff --check
          printf '\nFAILURES=%s\n' "$failures" >> "$REPORT"
          echo "failures=$failures" >> "$GITHUB_OUTPUT"
          cat "$REPORT"
          exit 0
      - name: Commit successful reconciliation
        if: steps.gates.outputs.failures == '0'
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/reconcile-validation.md docs/reconcile-validation-20260822.md
          git rm .github/workflows/reconcile-main.yml
          git add -A
          git commit -m "merge: reconcile main into production release"
          git push origin HEAD:release/go-live-20260822
      - name: Record reconciliation blockers without merging
        if: steps.gates.outputs.failures != '0'
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/reconcile-validation.md /tmp/reconcile-failure.md
          git merge --abort
          cp /tmp/reconcile-failure.md docs/reconcile-failure-20260822.md
          git rm .github/workflows/reconcile-main.yml
          git add docs/reconcile-failure-20260822.md
          git commit -m "ci: record release reconciliation blockers"
          git push origin HEAD:release/go-live-20260822
          exit 1
