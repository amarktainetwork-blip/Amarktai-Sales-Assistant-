name: Diagnose Unit Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  vitest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Capture unit-test output
        shell: bash
        run: |
          set +e
          pnpm test > vitest.log 2>&1
          status=$?
          cat vitest.log
          echo "$status" > vitest-exit-code.txt
          exit 0
      - name: Upload unit-test diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: vitest-diagnostics-${{ github.sha }}
          path: |
            vitest.log
            vitest-exit-code.txt
          if-no-files-found: error
