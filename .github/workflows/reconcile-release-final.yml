name: Final release reconciliation

# retrigger: 2026-08-22T20:18Z
on:
  push:
    branches: ["release/go-live-20260822"]
    paths: [".github/workflows/reconcile-release-final.yml"]

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/go-live-20260822
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: pnpm
      - name: Reconcile main and run source release gates
        shell: bash
        run: |
          set +e
          git config user.name "amarktai-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git fetch origin main --prune
          RELEASE_PARENT="$(git rev-parse HEAD)"
          MAIN_PARENT="$(git rev-parse origin/main)"
          REPORT=/tmp/reconcile-final.md
          : > "$REPORT"
          failures=0
          printf '# Final release reconciliation — 2026-08-22\n\n' >> "$REPORT"
          printf -- '- Release parent: `%s`\n- Main parent: `%s`\n\n' "$RELEASE_PARENT" "$MAIN_PARENT" >> "$REPORT"

          git merge --no-commit --no-ff origin/main >/tmp/merge.log 2>&1
          merge_code=$?
          conflicts="$(git diff --name-only --diff-filter=U)"
          if [ -n "$conflicts" ]; then
            printf -- '- Conflicts resolved with release implementation only for conflicted paths:\n' >> "$REPORT"
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              printf '  - `%s`\n' "$path" >> "$REPORT"
              if git show ":2:$path" >/dev/null 2>&1; then
                git checkout --ours -- "$path" >/dev/null 2>&1
                git add -- "$path"
              else
                git rm -f -- "$path" >/dev/null 2>&1
              fi
            done <<EOF
$conflicts
EOF
          fi
          if git diff --name-only --diff-filter=U | grep -q .; then
            failures=$((failures+1))
            printf -- '- merge_resolution: FAIL\n\n```text\n' >> "$REPORT"
            git diff --name-only --diff-filter=U >> "$REPORT"
            printf '\n```\n' >> "$REPORT"
          else
            printf -- '- merge_resolution: PASS (merge command exit %s; all conflicts resolved)\n' "$merge_code" >> "$REPORT"
          fi

          gate() {
            name="$1"; shift
            log="/tmp/${name}.log"
            "$@" >"$log" 2>&1
            code=$?
            if [ "$code" -eq 0 ]; then
              printf -- '- %s: PASS\n' "$name" >> "$REPORT"
            else
              failures=$((failures+1))
              printf -- '- %s: FAIL\n\n```text\n' "$name" >> "$REPORT"
              tail -n 160 "$log" >> "$REPORT"
              printf '\n```\n' >> "$REPORT"
            fi
          }

          gate frozen_install pnpm install --frozen-lockfile
          gate unit_tests pnpm test
          gate typescript pnpm check
          gate drizzle_check env DATABASE_URL=mysql://migration:placeholder@127.0.0.1:3306/amarktai pnpm exec drizzle-kit check
          rm -rf /tmp/drizzle-before && cp -R drizzle /tmp/drizzle-before
          gate drizzle_generate env DATABASE_URL=mysql://migration:placeholder@127.0.0.1:3306/amarktai pnpm exec drizzle-kit generate
          if diff -qr /tmp/drizzle-before drizzle >/tmp/drizzle-diff.log 2>&1; then
            printf -- '- migration_generation_clean: PASS\n' >> "$REPORT"
          else
            failures=$((failures+1))
            printf -- '- migration_generation_clean: FAIL\n\n```text\n' >> "$REPORT"
            tail -n 120 /tmp/drizzle-diff.log >> "$REPORT"
            printf '\n```\n' >> "$REPORT"
          fi
          rm -rf drizzle && cp -R /tmp/drizzle-before drizzle
          git checkout -- drizzle >/dev/null 2>&1 || true
          gate production_build pnpm build
          gate production_audit pnpm audit --prod --audit-level=high
          gate shell_syntax sh -n deploy/webdock/install.sh deploy/webdock/preflight.sh deploy/webdock/backup.sh deploy/webdock/restore.sh deploy/webdock/update.sh deploy/webdock/smoke-test.sh deploy/webdock/verify-production.sh

          if grep -RInE '(/manus-storage|BUILT_IN_FORGE|x-manus-user-session|vite-plugin-manus-runtime|manus\.computer|manuspre)' client/src server deploy --exclude-dir=node_modules >/tmp/hosted.log 2>&1; then
            failures=$((failures+1)); printf -- '- hosted_runtime_scan: FAIL\n\n```text\n' >> "$REPORT"; cat /tmp/hosted.log >> "$REPORT"; printf '\n```\n' >> "$REPORT"
          else printf -- '- hosted_runtime_scan: PASS\n' >> "$REPORT"; fi

          if grep -RInE '(Course2Career|Amelia|Cyber Security|447428000560|CYBER_CLOSED_LOST)' client/src server deploy --exclude-dir=node_modules | grep -v 'server/presets/course2career' >/tmp/generic.log 2>&1; then
            failures=$((failures+1)); printf -- '- generic_product_scan: FAIL\n\n```text\n' >> "$REPORT"; cat /tmp/generic.log >> "$REPORT"; printf '\n```\n' >> "$REPORT"
          else printf -- '- generic_product_scan: PASS\n' >> "$REPORT"; fi

          if grep -RIn 'git clone https://github.com/amarktainetwork-blip/Amarktai-Sales-Assistant.git' README.md docs deploy >/tmp/wrongrepo.log 2>&1; then
            failures=$((failures+1)); printf -- '- canonical_repo_docs: FAIL\n\n```text\n' >> "$REPORT"; cat /tmp/wrongrepo.log >> "$REPORT"; printf '\n```\n' >> "$REPORT"
          else printf -- '- canonical_repo_docs: PASS\n' >> "$REPORT"; fi

          cp deploy/webdock/configuration.template .env
          gate compose_full docker compose -f deploy/webdock/docker-compose.yml --env-file .env config
          gate compose_pilot docker compose -f deploy/webdock/docker-compose.pilot.yml --env-file .env config
          gate diff_check git diff --check

          printf '\nFAILURES=%s\n' "$failures" >> "$REPORT"
          rm -f .env

          if [ "$failures" -eq 0 ]; then
            mkdir -p docs
            cp "$REPORT" docs/final-release-validation-20260822.md
            rm -f docs/final-release-failure-20260822.md docs/reconcile-failure-20260822.md
            git rm .github/workflows/reconcile-release-final.yml
            git add docs/final-release-validation-20260822.md docs/final-release-failure-20260822.md docs/reconcile-failure-20260822.md 2>/dev/null || true
            git commit -m "release: reconcile main into validated go-live candidate"
            git push origin HEAD:release/go-live-20260822
            cat "$REPORT"
            exit 0
          fi

          git merge --abort >/dev/null 2>&1 || true
          mkdir -p docs
          cp "$REPORT" docs/final-release-failure-20260822.md
          git rm .github/workflows/reconcile-release-final.yml
          git add docs/final-release-failure-20260822.md
          git commit -m "ci: record final reconciliation blockers"
          git push origin HEAD:release/go-live-20260822
          cat "$REPORT"
          exit 1
