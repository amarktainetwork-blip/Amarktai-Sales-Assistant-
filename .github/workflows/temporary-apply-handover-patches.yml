name: Temporary handover source patch

on:
  push:
    branches: ["fix/client-handover-mailbox-readiness-ui"]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run handover truth patch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/client-handover-mailbox-readiness-ui
          fetch-depth: 0
      - name: Patch client handover readiness truth
        run: python3 .github/scripts/temporary_patch_handover_truth.py
      - name: Sanity-check handover truth
        run: |
          grep -q 'state === "READY" && body.job?.status === "ready"' client/src/pages/CrmWorkspace.tsx
          grep -q 'integrationReadiness.data?.genie.ready' client/src/components/DashboardLayout.tsx
          grep -q 'getPersonalMailboxStatus' server/routers.ts
          ! grep -q 'safeReadsReady' client/src/pages/CrmWorkspace.tsx
          git diff --check
      - name: Commit handover readiness truth
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/routers.ts client/src/pages/CrmWorkspace.tsx client/src/components/DashboardLayout.tsx
          git commit -m "Use proven readiness across client handover surfaces"
          git push origin HEAD:fix/client-handover-mailbox-readiness-ui
