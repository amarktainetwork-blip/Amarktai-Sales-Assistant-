name: Temporary handover source patch

on:
  push:
    branches: ["fix/client-handover-mailbox-readiness-ui"]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run handover source patch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/client-handover-mailbox-readiness-ui
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Extend mailbox schema
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('drizzle/schema.ts')
          text = p.read_text()
          old = 'provider: mysqlEnum("provider", ["microsoft"]).notNull(),'
          if text.count(old) != 1:
              raise SystemExit(f'provider enum count={text.count(old)}')
          text = text.replace(old, 'provider: mysqlEnum("provider", ["microsoft", "google", "smtp"]).notNull(),', 1)
          start = text.index('export const userMailboxOAuthStates = mysqlTable(')
          end = text.index('/** Fail-closed recipient suppression', start)
          section = text[start:end]
          marker = '    redirectUri: varchar("redirectUri", { length: 1024 }).notNull(),\n    expiresAt: timestamp("expiresAt").notNull(),'
          if section.count(marker) != 1:
              raise SystemExit(f'user mailbox oauth marker count={section.count(marker)}')
          section = section.replace(marker, '    redirectUri: varchar("redirectUri", { length: 1024 }).notNull(),\n    provider: mysqlEnum("provider", ["microsoft", "google"])\n      .notNull()\n      .default("microsoft"),\n    expiresAt: timestamp("expiresAt").notNull(),', 1)
          text = text[:start] + section + text[end:]
          p.write_text(text)
          PY
      - name: Bind Microsoft OAuth state and inbound route
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server/delegatedMailbox.ts')
          text = p.read_text()
          changes = [
            (
              '    nonce,\n    redirectUri: config.redirectUri!,\n    expiresAt: new Date(Date.now() + 10 * 60_000),',
              '    nonce,\n    redirectUri: config.redirectUri!,\n    provider: "microsoft",\n    expiresAt: new Date(Date.now() + 10 * 60_000),',
              'oauth insert',
            ),
            (
              '          eq(userMailboxOAuthStates.nonce, nonce),\n          isNull(userMailboxOAuthStates.consumedAt),',
              '          eq(userMailboxOAuthStates.nonce, nonce),\n          eq(userMailboxOAuthStates.provider, "microsoft"),\n          isNull(userMailboxOAuthStates.consumedAt),',
              'oauth consume guard',
            ),
            (
              '              provider: "microsoft_delegated",\n              displayName: "Your Microsoft mailbox",\n              connectionMode: "delegated_oauth",\n              requiredCapability: "Mail.Send",',
              '              provider: "personal_mailbox",\n              mailboxProvider: "microsoft",\n              displayName: "Your Microsoft mailbox",\n              connectionMode: "delegated_oauth",\n              requiredCapability: "Mail.Read + Mail.Send",',
              'inbound route',
            ),
          ]
          for old, new, label in changes:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label} count={count}')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY
      - name: Generate exact Drizzle migration
        env:
          DATABASE_URL: mysql://migration:placeholder@127.0.0.1:3306/amarktai
        run: pnpm exec drizzle-kit generate --name provider_neutral_personal_mailbox
      - name: Commit schema and Microsoft compatibility changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drizzle server/delegatedMailbox.ts
          git diff --cached --check
          git commit -m "Add provider-neutral mailbox schema and Microsoft compatibility"
          git push origin HEAD:fix/client-handover-mailbox-readiness-ui
