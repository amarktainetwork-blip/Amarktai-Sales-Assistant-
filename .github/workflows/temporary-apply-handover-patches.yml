name: Temporary handover source patch

on:
  push:
    branches: ["fix/client-handover-mailbox-readiness-ui"]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run canonical mailbox patch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/client-handover-mailbox-readiness-ui
          fetch-depth: 0
      - name: Patch canonical approved-action mailbox execution
        run: python3 .github/scripts/temporary_patch_canonical.py
      - name: Sanity-check mailbox seam
        run: |
          grep -q 'executePersonalMailbox' server/crm/canonicalActionExecution.ts
          grep -q 'route.provider === "personal_mailbox"' server/crm/canonicalActionExecution.ts
          ! grep -q 'executeMicrosoft' server/crm/canonicalActionExecution.ts
          git diff --check
      - name: Commit canonical mailbox execution
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/crm/canonicalActionExecution.ts
          git commit -m "Execute approved actions through the reviewed mailbox provider"
          git push origin HEAD:fix/client-handover-mailbox-readiness-ui
