name: Phase 1 Readiness Boundary Fix

on:
  push:
    branches: [fix/commissioning-readiness-teach-ui]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/commissioning-readiness-teach-ui
          fetch-depth: 0
      - name: Extract neutral commissioning readiness boundary
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          module = Path('server/crm/commissioningReadiness.ts')
          module.write_text('''export const CORE_BROWSER_OPERATIONS = [
            "contact.search",
            "contact.read",
            "task.list",
            "note.create",
            "task.create_callback",
            "opportunity.read",
            "opportunity.update",
          ] as const;

          export function coreBrowserCommissioningReady(
            statuses: ReadonlyMap<string, string>
          ) {
            return CORE_BROWSER_OPERATIONS.every(
              key => statuses.get(key) === "LIVE_PROVEN"
            );
          }
          ''', encoding='utf-8')

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} occurrence(s), found {actual}')
              p.write_text(text.replace(old, new, count), encoding='utf-8')

          replace_exact(
              'server/crm/automaticCommissioning.ts',
              '} from "./types";\n\nexport const COMMISSIONING_STATES',
              '} from "./types";\nimport {\n  CORE_BROWSER_OPERATIONS,\n  coreBrowserCommissioningReady,\n} from "./commissioningReadiness";\n\nexport { CORE_BROWSER_OPERATIONS, coreBrowserCommissioningReady };\n\nexport const COMMISSIONING_STATES'
          )
          replace_exact(
              'server/crm/automaticCommissioning.ts',
              '''const CORE_BROWSER_OPERATIONS = [
            "contact.search",
            "contact.read",
            "task.list",
            "note.create",
            "task.create_callback",
            "opportunity.read",
            "opportunity.update",
          ] as const;

          ''',
              ''
          )
          replace_exact(
              'server/crm/automaticCommissioning.ts',
              '''export function coreBrowserCommissioningReady(
            statuses: ReadonlyMap<string, string>
          ) {
            return CORE_BROWSER_OPERATIONS.every(
              key => statuses.get(key) === "LIVE_PROVEN"
            );
          }

          ''',
              ''
          )
          replace_exact(
              'server/genie/organisationReadiness.ts',
              'import { coreBrowserCommissioningReady } from "../crm/automaticCommissioning";',
              'import { coreBrowserCommissioningReady } from "../crm/commissioningReadiness";'
          )
          replace_exact(
              'server/organisation.ts',
              'import { coreBrowserCommissioningReady } from "./crm/automaticCommissioning";',
              'import { coreBrowserCommissioningReady } from "./crm/commissioningReadiness";'
          )

          p = Path('server/productionReadinessUi.test.ts')
          text = p.read_text(encoding='utf-8')
          old = '''  it("completes onboarding only after confirmed knowledge, authentication and safe reads", () => {
            const crm = read("../client/src/pages/CrmWorkspace.tsx");
            const organisation = read("./organisation.ts");
            expect(crm).toContain('browserAuthenticationState !== "AUTHENTICATED"');
            expect(crm).toContain('safeReads?.status === "Ready"');
            expect(crm).toContain('discoveryStatus !== "confirmed"');
            expect(crm).toContain("mutateAsync({ step: 4, complete: true })");
            expect(organisation).toContain('profile.discoveryStatus === "confirmed"');
            expect(organisation).toContain("safeReadConnections.has(system.id)");
            expect(organisation).toMatch(
              /!\\[\\s*"authentication_expired",[\\s\\S]*?"error",?\\s*\\]\\.includes\\(system\\.status\\)/
            );
          });'''
          new = '''  it("keeps the current setup handoff but refuses server completion until CRM core operations are proven", () => {
            const crm = read("../client/src/pages/CrmWorkspace.tsx");
            const organisation = read("./organisation.ts");
            expect(crm).toContain('browserAuthenticationState !== "AUTHENTICATED"');
            expect(crm).toContain('safeReads?.status === "Ready"');
            expect(crm).toContain('discoveryStatus !== "confirmed"');
            expect(crm).toContain("mutateAsync({ step: 4, complete: true })");
            expect(organisation).toContain('profile.discoveryStatus === "confirmed"');
            expect(organisation).toContain("browserOperationReadinessForSystem");
            expect(organisation).toContain("coreBrowserCommissioningReady(statuses)");
            expect(organisation).not.toContain("safeReadConnections.has(system.id)");
          });'''
          if text.count(old) != 1:
              raise SystemExit('productionReadinessUi.test.ts: expected onboarding contract block once')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          git rm .github/workflows/phase1-readiness-fix.yml
          git config user.name "amarktainetwork-blip"
          git config user.email "amarktainetwork@gmail.com"
          git add server/crm/commissioningReadiness.ts server/crm/automaticCommissioning.ts server/genie/organisationReadiness.ts server/organisation.ts server/productionReadinessUi.test.ts
          git diff --cached --check
          git commit -m "Extract CRM commissioning readiness gate"
          git push origin HEAD:fix/commissioning-readiness-teach-ui
